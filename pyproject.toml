[project]
name = "mtorch"
version = "0.1.3"
authors = [{ name = "dmzc", email = "congxinsuoyubuyuju@foxmail.com" }]
description = "A minimal NumPy-based reverse-mode autograd deep learning framework"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["numpy>=2.2.6"]
keywords = ["autograd", "numpy", "neural-network", "deep-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build=1.5.0",
    "twine=7.0.0",
    "zstandard=0.25.0",
    "orjson=3.12.0",
    "matplotlib=3.10.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 源发行包 tar.gz
[tool.hatch.build.targets.sdist]
exclude = ["/draft/"]

# wheel包（pip安装用的包）
[tool.hatch.build.targets.wheel]
exclude = ["/mtorch/utils/data/resources/", "/draft/"]
