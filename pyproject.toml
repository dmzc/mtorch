[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mtorch"
version = "0.1.2"
authors = [{ name = "dmzc", email = "congxinsuoyubuyuju@foxmail.com" }]
description = "A minimal NumPy-based reverse-mode autograd deep learning framework"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["numpy>=2.2.6"]
keywords = ["autograd", "numpy", "neural-network", "deep-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]
[project.optional-dependencies]
dev = ["pytest>=7.0", "build", "twine"]

[tool.setuptools]
packages = ["mtorch"]

[tool.setuptools.exclude-package-data]
"mtorch" = ["examples/*", "tests/*", "__pycache__/*"]
